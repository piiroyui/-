            <div class="bg-gray-50 p-4 rounded-lg mt-8 mb-4">

        <div id="listEditModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden"> <div class="bg-white p-6 rounded-lg w-full max-w-md"> <h2 class="text-xl font-semibold mb-4">取引編集</h2> <input type="hidden" id="editId"> <input type="hidden" id="editTransactionType"> <div class="mb-2"><label>日付:</label><input type="date" id="editDate" class="w-full p-2 border rounded"></div> <div class="mb-2"><label>金額:</label><input type="number" id="editAmount" class="w-full p-2 border rounded" min="1"></div> <div class="mb-2"> <label for="editDescriptionSelect" class="block text-sm font-medium text-gray-700">摘要:</label> <select id="editDescriptionSelect" class="w-full p-2 border rounded mt-1"></select> <input type="text" id="editDescriptionOther" class="w-full p-2 border rounded mt-2 hidden-input" placeholder="摘要を自由入力"> </div> <div class="mb-2"><label>科目:</label><select id="editAccountSelect" class="w-full p-2 border rounded"></select></div> <div class="mb-2"> <label for="editTaxCategory" class="block text-sm font-medium text-gray-700">税区分:</label> <select id="editTaxCategory" class="w-full p-2 border rounded mt-1"></select> </div> <div class="mb-3"> <label class="inline-flex items-center"> <input type="checkbox" id="editInvoiceYn" class="mr-2"> 適格請求書発行事業者 </label> </div> <div class="flex justify-end space-x-2 mt-4"> <button id="saveEditBtn" class="bg-indigo-600 text-white py-2 px-4 rounded">保存</button> <button id="deleteEditBtn" class="bg-red-500 text-white py-2 px-4 rounded">削除</button> <button id="cancelEditBtn" class="bg-gray-200 text-gray-700 py-2 px-4 rounded">キャンセル</button> </div> </div> </div>
        <div id="balanceCheckModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden"> </div>
    </div>

    <script defer>
        document.addEventListener('DOMContentLoaded', () => {
            const accountTitles = ['食料仕入高','外注工賃','租税公課','荷造運賃','水道光熱費','旅費交通費','通信費','広告宣伝費','接待交際費','損害保険料','修繕費','消耗品費','福利厚生費','地代家賃','リース料','研修採用費','新聞図書費','会議費','場所代','音響・照明','映像撮影','支払手数料','雑費','資金移動','仮払金','事業主貸', '現金過不足', '売上高', '事業主借', '雑収入'];
            // ★★★【変更】税区分の表記をマネーフォワード形式に統一 ★★★
            const taxCategories = ["対象外", "課税仕入 10%", "課税仕入 (軽)8%", "課税売上 10%", "課税売上 (軽)8%", "非課税売上", "非課税仕入", "不課税"];
            const paymentTaxCategories = ["課税仕入 (軽)8%", "課税仕入 10%"];
            // 過去の表記ゆれ（例: 課税仕入8%(軽)）をMF形式に読み替える。保存済みデータは書き換えず、表示・編集・エクスポート時に統一する
            const TAX_CATEGORY_NORMALIZE_MAP = {
                "課税仕入8%(軽)": "課税仕入 (軽)8%", "課税仕入(軽)8%": "課税仕入 (軽)8%", "課税仕入軽8%": "課税仕入 (軽)8%", "課税仕入8%軽": "課税仕入 (軽)8%",
                "課税仕入10%": "課税仕入 10%",
                "課税売上8%(軽)": "課税売上 (軽)8%", "課税売上(軽)8%": "課税売上 (軽)8%", "課税売上軽8%": "課税売上 (軽)8%", "課税売上8%軽": "課税売上 (軽)8%",
                "課税売上10%": "課税売上 10%"
            };
            function normalizeTaxCategory(tc) {
                if (!tc) return tc;
                const compact = String(tc)
                    .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
                    .replace(/％/g, '%').replace(/（/g, '(').replace(/）/g, ')')
                    .replace(/[\s　]+/g, '');
                return TAX_CATEGORY_NORMALIZE_MAP[compact] || tc;
            }
            const OTHER_DESCRIPTION = "その他";
            const defaultDescriptions = [ { text: "レジ現金から入金", type: "deposit", account: "資金移動" }, { text: "売上金から入金", type: "deposit", account: "資金移動" }, { text: "フレスコ", type: "payment", account: "食料仕入高" }, { text: "業務スーパー", type: "payment", account: "食料仕入高" }, { text: "木村喜商店", type: "payment", account: "食料仕入高" }, { text: "八百屋みどりなす", type: "payment", account: "食料仕入高" }, { text: "株式会社プロサムフーズ", type: "payment", account: "食料仕入高" }, { text: "SARTAJ", type: "payment", account: "食料仕入高" }, { text: "神戸スパイス", type: "payment", account: "食料仕入高" }, { text: "関西電力", type: "payment", account: "水道光熱費" }, { text: "ワッツ", type: "payment", account: "消耗品費" }, { text: "新鮮市場", type: "payment", account: "食料仕入高" }, { text: "叶屋", type: "payment", account: "食料仕入高" }, { text: "ムスリムCOOP", type: "payment", account: "食料仕入高" }, ];
            const accountTitleToCodeMap = { '食料仕入高': 100, '外注工賃': 101, '租税公課': 102, '荷造運賃': 103, '水道光熱費': 104, '旅費交通費': 105, '通信費': 106, '広告宣伝費': 107, '接待交際費': 108, '損害保険料': 109, '修繕費': 110, '消耗品費': 111, '福利厚生費': 112, '地代家賃': 113, 'リース料': 114, '研修採用費': 115, '新聞図書費': 116, '会議費': 117, '場所代': 118, '音響・照明': 119, '映像撮影': 120, '支払手数料': 121, '雑費': 122, '資金移動': 123, '仮払金': 124, '事業主借': 125 };
            const firebaseConfig = { apiKey: "AIzaSyDGIhsybWV-Flv9VIHKF99XuCU6hge_MeM", authDomain: "yapicashbook.firebaseapp.com", projectId: "yapicashbook", storageBucket: "yapicashbook.firebasestorage.app", messagingSenderId: "744431657302", appId: "1:744431657302:web:2ea0b04af4ea92511276f7", measurementId: "G-TBKDF69T9Q" };
            
            let appInstance, authInstance, dbInstance;
            let currentTransactionType = 'deposit'; // 現在のフォームタイプを管理

            try {
                appInstance = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
                authInstance = firebase.auth(appInstance);
                dbInstance = firebase.firestore(appInstance);
            } catch (e) {
                console.error("Firebase initialization failed:", e);
                alert("Firebaseの初期化に失敗しました。");
                return;
            }

            let currentUser = null;
            let allTransactions = [];
            let descriptionsConfig = [], depositDescriptions = [], paymentDescriptions = [], descriptionToAccountTitleMap = {};
            let displayedDate = new Date();
            let customAccounts = []; // ★★★【追加】ユーザーが追加した勘定科目 { id, name, code }

            // ★★★【追加】勘定科目の一覧（標準 + 追加分）とMFコードの取得 ★★★
            function getAllAccountTitles() {
                const extra = customAccounts.map(a => a.name).filter(n => !accountTitles.includes(n));
                return [...accountTitles, ...extra];
            }
            function getAccountCode(name) {
                if (!name) return '';
                if (accountTitleToCodeMap[name] !== undefined) return accountTitleToCodeMap[name];
                const custom = customAccounts.find(a => a.name === name);
                return custom && custom.code ? custom.code : '';
            }
            function fillAccountSelect(selectEl, selectedValue = '', placeholder = '') {
                if (!selectEl) return;
                selectEl.innerHTML = '';
                if (placeholder) { const p = document.createElement('option'); p.value = ''; p.textContent = placeholder; selectEl.appendChild(p); }
                const titles = getAllAccountTitles();
                if (selectedValue && !titles.includes(selectedValue)) titles.push(selectedValue); // 削除済みの科目でも消えないように残す
                titles.forEach(t => { const opt = document.createElement('option'); opt.value = t; opt.textContent = t; if (t === selectedValue) opt.selected = true; selectEl.appendChild(opt); });
            }
            async function loadCustomAccounts() {
                if (!currentUser || !dbInstance) { customAccounts = []; return; }
                try {
                    const snap = await dbInstance.collection('users').doc(currentUser.uid).collection('accounts').orderBy('name').get();
                    customAccounts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch (error) {
                    console.error("Error loading custom accounts:", error);
                    customAccounts = [];
                }
            }

            async function loadSettings() { if (!currentUser || !dbInstance) { descriptionsConfig = []; rebuildDescriptionArrays(); return; } const settingsRef = dbInstance.collection('users').doc(currentUser.uid).collection('descriptions').orderBy('text'); try { const snapshot = await settingsRef.get(); if (snapshot.empty) { const batch = dbInstance.batch(); defaultDescriptions.forEach(desc => { const docRef = dbInstance.collection('users').doc(currentUser.uid).collection('descriptions').doc(); batch.set(docRef, desc); }); await batch.commit(); const newSnapshot = await settingsRef.get(); descriptionsConfig = newSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); } else { descriptionsConfig = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); } rebuildDescriptionArrays(); } catch (error) { console.error("Error loading description settings:", error); alert("摘要設定の読み込みに失敗しました。"); descriptionsConfig = []; rebuildDescriptionArrays(); } }
            function rebuildDescriptionArrays() { depositDescriptions = descriptionsConfig.filter(d => d.type === 'deposit').map(d => d.text); depositDescriptions.push(OTHER_DESCRIPTION); paymentDescriptions = descriptionsConfig.filter(d => d.type === 'payment').map(d => d.text); paymentDescriptions.push(OTHER_DESCRIPTION); descriptionToAccountTitleMap = {}; descriptionsConfig.forEach(d => { descriptionToAccountTitleMap[d.text] = d.account; }); descriptionToAccountTitleMap[OTHER_DESCRIPTION] = "仮払金"; }
            // ★★★【変更】摘要ごとの科目をその場で変更できるように ★★★
            function renderAdminList() {
                const tbody = document.getElementById('adminListBody'); if (!tbody) return; tbody.innerHTML = '';
                descriptionsConfig.forEach(config => {
                    const tr = document.createElement('tr');
                    const tdText = document.createElement('td'); tdText.className = 'border px-2 py-1'; tdText.textContent = config.text;
                    const tdType = document.createElement('td'); tdType.className = 'border px-2 py-1'; tdType.textContent = config.type === 'deposit' ? '入金' : '支払い';
                    const tdAccount = document.createElement('td'); tdAccount.className = 'border px-2 py-1';
                    const sel = document.createElement('select'); sel.className = 'w-full p-1 border rounded';
                    fillAccountSelect(sel, config.account);
                    sel.addEventListener('change', async () => {
                        const newAccount = sel.value;
                        if (!confirm(`「${config.text}」の科目を「${config.account}」→「${newAccount}」に変更しますか？\n※これから登録する取引に反映されます（過去の取引は変わりません）`)) { sel.value = config.account; return; }
                        try {
                            await dbInstance.collection('users').doc(currentUser.uid).collection('descriptions').doc(config.id).update({ account: newAccount });
                            alert('科目を変更しました。');
                            await loadSettings(); renderAdminList();
                        } catch (error) { console.error("Error updating description account:", error); alert("科目の変更に失敗しました。"); sel.value = config.account; }
                    });
                    tdAccount.appendChild(sel);

                if (!currentUser) return alert('ログインしていません。');
                
                const dateStr = document.getElementById('transactionDate').value;

                if (currentTransactionType === 'deposit') {
                    // 入金処理

                    let selectedDesc = document.getElementById('depositDescriptionSelect').value;
                    let finalDesc = selectedDesc === OTHER_DESCRIPTION ? document.getElementById('depositDescriptionOther').value.trim() : selectedDesc;
                    const handlerName = document.getElementById('depositHandlerName').value.trim();

                    if (isNaN(amount) || amount <= 0 || !finalDesc) return alert('金額（正の数）と摘要を正しく入力・選択してください。');
                    
                    const accountTitleValue = descriptionToAccountTitleMap[selectedDesc] || '';
                    const transactionData = { date: dateStr, type: 'deposit', amount, description: finalDesc, accountTitle: accountTitleValue, taxCategory: "対象外", invoiceYn: false, createdAt: firebase.firestore.FieldValue.serverTimestamp() };

                        alert('取引登録エラー');

                    let mainDesc = selectedDesc === OTHER_DESCRIPTION ? document.getElementById('paymentDescriptionOther').value.trim() : selectedDesc;
                    const handlerName = document.getElementById('paymentHandlerName').value.trim();

                    if (!mainDesc) return alert('買った場所（摘要）を入力・選択してください。');

                    const detailRows = document.querySelectorAll('.payment-detail-row');
                    if (detailRows.length === 0) return alert('明細を1つ以上追加してください。');

                    const batch = dbInstance.batch();
                    const transactionsToCreate = [];
                    let hasError = false;

                    detailRows.forEach(row => {
                        const subtotal = parseFloat(row.querySelector('.detail-subtotal').value || 0);
                        if (subtotal <= 0) {
                            hasError = true;
                        }
                        const taxCategory = row.querySelector('.detail-tax-select').value;
                        const content = row.querySelector('.detail-content').value.trim();
                        
                        const finalDesc = content ? `${mainDesc} - ${content}` : mainDesc;
                        const accountTitleValue = descriptionToAccountTitleMap[selectedDesc] || '';

                        transactionsToCreate.push({
                            date: dateStr, type: 'payment', amount: subtotal, description: finalDesc,
                            accountTitle: accountTitleValue, taxCategory, invoiceYn: false,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            ...(handlerName && { handlerName })
                        });
                    });

                    if (hasError) return alert('すべての明細に正しい小計（正の数）を入力してください。');
                    if (transactionsToCreate.length === 0) return alert('登録する明細がありません。');

                        await loadAllTransactions();
                        showScreen('homeScreen');
                    } catch(error) {

                        alert('支払い登録エラー');
                    }
                }
            });

                            <hr>
                            <div class="flex justify-between items-center"><label class="text-gray-600">差額:</label><span id="balanceDifference" class="font-bold text-lg">¥0</span></div>
                            <div id="differenceCommentWrapper" class="hidden"><label for="differenceComment" class="block text-sm font-medium text-gray-700">コメント (差額の理由など):</label><textarea id="differenceComment" class="w-full p-2 border rounded mt-1" rows="2"></textarea></div>
                        </div>
                        <div class="flex justify-between mt-6">
                            <button id="closeBalanceCheckBtn" class="bg-gray-200 text-gray-700 py-2 px-4 rounded">閉じる</button>
                            <button id="registerCheckResultBtn" class="bg-green-600 text-white py-2 px-4 rounded">チェック結果を登録</button>
                        </div>
                    </div>`;
                modal.classList.remove('hidden');
                const actualCashInput = document.getElementById('actualCashInput');
                const balanceDifferenceEl = document.getElementById('balanceDifference');
                const commentWrapper = document.getElementById('differenceCommentWrapper');
                
                const calculateDifference = () => {
                    const actualCash = parseFloat(actualCashInput.value || 0);
                    difference = actualCash - bookBalance;
                    balanceDifferenceEl.textContent = `¥${difference.toLocaleString()}`;
                    if (difference === 0) {
                        balanceDifferenceEl.className = 'font-bold text-lg text-gray-800';
                        commentWrapper.classList.add('hidden');
                    } else {
                        balanceDifferenceEl.className = difference > 0 ? 'font-bold text-lg text-green-600' : 'font-bold text-lg text-red-600';
                        commentWrapper.classList.remove('hidden');
                    }
                };
                actualCashInput.addEventListener('input', calculateDifference);
                actualCashInput.focus();
                calculateDifference();
                const closeModal = () => { modal.classList.add('hidden'); modal.innerHTML = ''; };
                document.getElementById('closeBalanceCheckBtn').addEventListener('click', closeModal);
                modal.addEventListener('click', closeModal);

                document.getElementById('registerCheckResultBtn').addEventListener('click', async () => {
                    const handlerName = document.getElementById('balanceCheckHandlerName').value.trim();
                    if (!handlerName) { alert('担当者名を入力してください。'); return; }
                    
                    const today = new Date();
                    const dateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                    let transactionData;
                    let alertMessage;

                    if (difference === 0) {
                        transactionData = { date: dateStr, type: 'deposit', amount: 0, description: '残高一致を確認', accountTitle: '現金過不足', taxCategory: '対象外', invoiceYn: false, handlerName, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
                        alertMessage = '残高が一致したことを記録しました。';
                    } else {
                        const comment = document.getElementById('differenceComment').value.trim();
                        transactionData = { date: dateStr, type: difference > 0 ? 'deposit' : 'payment', amount: Math.abs(difference), description: comment || '残高チェックによる調整', accountTitle: '現金過不足', taxCategory: '対象外', invoiceYn: false, handlerName, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
                        alertMessage = `差額(¥${difference.toLocaleString()})を「現金過不足」として登録しました。`;
                    }
                    
                    try {
                        await dbInstance.collection('users').doc(currentUser.uid).collection('transactions').add(transactionData);
                        alert(alertMessage);
                        closeModal();
                        await loadAllTransactions();
                    } catch (error) {
                        console.error("Error adding check result transaction:", error);
                        alert("チェック結果の登録に失敗しました。");
                    }
                });
            }
            document.getElementById('balanceCheckBtn').addEventListener('click', openBalanceCheckModal);
        });
    </script>
</body>
</html>
